<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__note">&copy; {{ now.Year }} {{ site.Params.name }}{{ with site.Params.role }} &middot; {{ . }}{{ end }}</p>
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.Params.email }}">Email</a></li>
      <li><a href="https://{{ site.Params.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="https://{{ site.Params.scholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a></li>
      <li><a href="{{ site.Params.cv_file | relURL }}">CV (PDF)</a></li>
    </ul>
  </div>
</footer>
